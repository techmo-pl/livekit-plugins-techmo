[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livekit-plugins-techmo"
version = "0.2.0"
description = "LiveKit Agents plugin for Techmo ASR speech-to-text service"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Techmo", email = "contact@techmo.pl" }]
requires-python = ">=3.10"
keywords = ["voice", "AI", "realtime", "audio", "livekit", "asr", "speech", "techmo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "livekit-agents>=1.0,<2.0",
    # techmo-asr-api stubs embed GRPC_GENERATED_VERSION 1.70.0 (older grpcio raises on import)
    "grpcio>=1.70.0",
    # techmo-asr-api ships stubs generated with protobuf 5.29 (older runtimes fail to import them)
    "protobuf>=5.29.0",
    "techmo-asr-api @ git+https://github.com/techmo-pl/asr-api-python.git@1.1.4",
]

[project.urls]
Homepage = "https://techmo.pl"
Documentation = "https://github.com/techmo-pl/livekit-plugins-techmo"
Source = "https://github.com/techmo-pl/livekit-plugins-techmo"
"Bug Tracker" = "https://github.com/techmo-pl/livekit-plugins-techmo/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[tool.hatch.metadata]
# techmo-asr-api is not on PyPI yet, so it is referenced by git URL
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["livekit"]

[tool.hatch.build.targets.sdist]
include = ["livekit"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
# livekit/ is a namespace package shared with livekit-agents and livekit-rtc
known-third-party = ["livekit"]
known-first-party = ["livekit.plugins.techmo"]

[tool.mypy]
# no python_version pin: dependency stubs (e.g. numpy) use syntax of the running interpreter
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
