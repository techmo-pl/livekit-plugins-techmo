name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}

      - name: Install build tools
        run: pip install hatchling grpcio-tools

      - name: Generate gRPC stubs
        run: python hatch_build.py

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check livekit/ tests/ examples/

      - name: Format check (ruff)
        run: ruff format --check livekit/ tests/ examples/

      - name: Type check (mypy)
        run: mypy livekit/plugins/techmo/ --ignore-missing-imports

      - name: Run unit tests
        run: pytest tests/ -v --ignore=tests/test_integration.py

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build hatchling grpcio-tools

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
